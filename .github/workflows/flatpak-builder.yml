name: Build Flatpak

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/flathub/flathub-github-actions:latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build Flatpak
        uses: flathub/flatpak-github-actions/flatpak-builder-action@v6
        with:
          bundle: com.github.taufiq.scratchclip.flatpak
          manifest-path: com.github.taufiq.scratchclip.json
          cache-key: flatpak-builder-${{ github.sha }}

      - name: Upload Flatpak
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: com.github.taufiq.scratchclip.flatpak
          path: com.github.taufiq.scratchclip.flatpak

      - name: Create Release
        uses: actions/create-release@v1
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ github.ref }}
          release_name: Release ${{ github.ref }}
          body: |
            Flatpak build for ScratchClip
            See [FLATHUB_SUBMISSION.md](FLATHUB_SUBMISSION.md) for installation instructions.
          draft: false
          prerelease: false

      - name: Upload Release Asset
        uses: actions/upload-release-asset@v1
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: com.github.taufiq.scratchclip.flatpak
          asset_name: com.github.taufiq.scratchclip.flatpak
          asset_content_type: application/octet-stream

